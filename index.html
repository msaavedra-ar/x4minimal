<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X4 Minimal</title><style>body{font-family:Georgia,serif;background:#eee;color:#111;margin:0}.app{max-width:420px;min-height:100vh;background:#fafaf7;margin:auto;padding:25px;box-sizing:border-box}header{display:flex;justify-content:space-between;font:12px sans-serif;margin-bottom:55px}h1{font-weight:normal}button{background:white;border:1px solid #555;padding:16px;width:100%;margin:8px 0;text-align:left;font:inherit}.hide{display:none}small{color:#666}textarea{width:100%;box-sizing:border-box;padding:12px;font:16px sans-serif}.bubble{border:1px solid #aaa;padding:12px;margin:10px 0}nav{margin-top:35px;border-top:1px solid #aaa;padding-top:12px}nav button{width:48%;text-align:center}</style><div class="app"><header><b>X4 MINIMAL</b><span>Wi-Fi ◉</span></header><section id="home"><small>LECTURA PRIMERO</small><h1>Biblioteca</h1><button onclick="show('read')">📖 El Camino de los Reyes<br><small>Continuar lectura · Ejemplo</small></button><button onclick="show('chats')">Mensajes<br><small>Sincronización cada 15 minutos (simulada)</small></button></section><section id="read" class="hide"><h1>Lectura</h1><p>Un espacio tranquilo para leer. Los mensajes pueden esperar.</p><small>Texto demostrativo, no pertenece a ningún libro.</small></section><section id="chats" class="hide"><h1>Mensajes</h1><small>Datos ficticios · Sin conexión real a WhatsApp</small><div id="list"></div><button onclick="sync()">Sincronizar ahora</button><p id="status"><small>Modo demostración</small></p></section><section id="chat" class="hide"><h1 id="person"></h1><div id="messages"></div><textarea id="input" placeholder="Escribir mensaje..."></textarea><button onclick="send()">Enviar mensaje de prueba</button></section><nav><button onclick="show('home')">Biblioteca</button> <button onclick="show('chats')">Mensajes</button></nav><small>X4 Minimal v0.1 · Prototipo web</small></div><script>const data=[{name:'Alex',msgs:['¿Nos vemos mañana?']},{name:'Equipo',msgs:['¡Buen día!']},{name:'Familia',msgs:['Avisame cuando llegues.']}];let current=0;function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');if(id==='chats')list();if(id==='chat')thread()}function list(){const el=document.getElementById('list');el.innerHTML='';data.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.name+' · '+c.msgs.at(-1);b.onclick=()=>{current=i;show('chat')};el.appendChild(b)})}function thread(){document.getElementById('person').textContent=data[current].name;const el=document.getElementById('messages');el.innerHTML='';data[current].msgs.forEach(m=>{let d=document.createElement('div');d.className='bubble';d.textContent=m;el.appendChild(d)})}function send(){const e=document.getElementById('input');if(!e.value.trim())return;data[current].msgs.push('Yo: '+e.value.trim());e.value='';thread()}function sync(){document.getElementById('status').textContent='Sincronización simulada completada. No se consultó WhatsApp.'}list()</script></html>
